{{/* Hugo partial for dynamic Open Graph meta tags for posts */}}

{{ $title := .Title }}
{{ $description := .Params.description | default .Summary }}
{{ $image := .Params.hero | default "/images/author/tyler.png" }}
{{ $baseURL := .Site.BaseURL }}
{{ $url := .Permalink }}

<meta property="og:title" content="{{ $title }}"/>
<meta property="og:type" content="article"/>
<meta property="og:description" content="{{ $description }}"/>
<meta property="og:image" content="{{ cond (hasPrefix $image "http") $image (print $baseURL $image) }}"/>
<meta property="og:url" content="{{ $url }}"/>
